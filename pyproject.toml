[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2beamer"
version = "0.1.0"
description = "Convert math/statistics papers (PDF) into Beamer presentations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "paper2beamer contributors"}
]
keywords = ["latex", "beamer", "pdf", "presentation", "academic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "click>=8.1",
    "rich>=13.0",
    "aiohttp>=3.9",
    "aiofiles>=23.0",
]

[project.optional-dependencies]
mineru = ["mineru[all]>=2.0"]
cloud = ["mineru-open-sdk>=0.1"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "httpx>=0.25",
]

[project.scripts]
paper2beamer = "paper2beamer.cli.main:cli"

[tool.setuptools.packages.find]
include = ["paper2beamer*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
